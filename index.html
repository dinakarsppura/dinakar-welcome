<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DINAKAR WELCOMES YOU</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #8b0000, #c62828, #ff7043);
            overflow: hidden;
        }

        .background {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
        }

        .circle1 {
            width: 400px;
            height: 400px;
            top: -180px;
            left: -120px;
        }

        .circle2 {
            width: 500px;
            height: 500px;
            bottom: -250px;
            right: -150px;
        }

        .card {
            position: relative;
            z-index: 2;
            width: min(90%, 800px);
            padding: 70px 40px;
            text-align: center;

            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.3);

            animation: appear 1.2s ease;
        }

        .welcome-icon {
            font-size: 55px;
            margin-bottom: 25px;
            animation: wave 2s infinite;
        }

        h1 {
            color: white;
            font-size: clamp(35px, 7vw, 70px);
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
        }

        h1 span {
            color: #ffe0b2;
        }

        .underline {
            width: 120px;
            height: 5px;
            margin: 30px auto 0;
            background: white;
            border-radius: 10px;
        }

        .footer {
            position: absolute;
            bottom: 25px;
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            letter-spacing: 2px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes wave {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(-10deg);
            }
            75% {
                transform: rotate(10deg);
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
    </div>

    <div class="card">

        <div class="welcome-icon">👋</div>

        <h1>
            <span>DINAKAR</span><br>
            WELCOMES YOU
        </h1>

        <div class="underline"></div>

    </div>

    <div class="footer">
        WELCOME • ENJOY • HAVE A GREAT DAY
    </div>

</body>
</html>
